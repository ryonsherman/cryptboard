name: Validate
on:
  pull_request_target:
    types: [opened, synchronize]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/pull/${{ github.event.number }}/head

      - name: Check only additions in messages/
        run: |
          git fetch origin "${{ github.event.pull_request.base.ref }}"
          git diff --name-status FETCH_HEAD HEAD |
          while read status file; do
            [ "$status" != "A" ] && echo "Non-additive: $status $file" && exit 1
            [[ "$file" != messages/* ]] && echo "Outside messages/: $file" && exit 1
          done

      - name: Validate message format
        run: |
          git fetch origin "${{ github.event.pull_request.base.ref }}"
          git diff --name-status FETCH_HEAD HEAD |
          awk '$1=="A"{print $2}' |
          while read f; do python3 .github/scripts/validate_message.py "$f"; done

      - name: Auto-merge
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge --squash "${{ github.event.pull_request.html_url }}"
