name: Validate
on:
  pull_request_target:
    types: [opened, synchronize]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/pull/${{ github.event.number }}/head

      - name: Check only additions in messages/
        run: |
          git fetch origin "${{ github.event.pull_request.base.ref }}"
          git log FETCH_HEAD..HEAD --pretty=format: --name-status > /tmp/changes || true
          awk '{if(NF>0 && $1!="A"){print "Non-additive: "$1" "$2; exit 1}}' /tmp/changes
          awk '{if(NF>0 && $2!~"^messages/"){print "Outside messages/: "$2; exit 1}}' /tmp/changes
          [ -s /tmp/changes ] || exit 1

      - name: Validate message format
        run: |
          awk '$1=="A" && NF>0 {print $2}' /tmp/changes |
          while read f; do python3 .github/scripts/validate_message.py "$f"; done

      - name: Auto-merge
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge --squash "${{ github.event.pull_request.html_url }}"
